<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hijinx · Universal CityWalk · Game Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="core/core.css">
<style>
  .index{max-width:1360px}
  .venue{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:28px;align-items:start}
  .map{position:sticky;top:16px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#0a1220}
  .map img{display:block;width:100%;height:auto}
  .spot{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;
    border:2px solid rgba(111,168,220,.55);border-radius:3px;background:rgba(111,168,220,.10);text-decoration:none;color:var(--fg);transition:background .12s,border-color .12s}
  .spot b{font-family:var(--display);font-size:clamp(10px,1.4vw,15px);line-height:1;letter-spacing:.02em;background:rgba(10,18,32,.85);padding:2px 5px;border-radius:3px}
  .spot small{font-size:9px;color:var(--muted);background:rgba(10,18,32,.85);padding:0 4px;border-radius:2px}
  .spot{border-style:dashed}
  .spot.p{border-color:rgba(255,107,98,.6);background:rgba(255,107,98,.10)}
  .spot.ready{border-style:solid;border-width:3px;background:rgba(111,168,220,.24);cursor:pointer}
  .spot.p.ready{background:rgba(255,107,98,.24)}
  .spot.ready small{color:var(--good)}
  .spot.ready:hover,.spot.hot{border-color:var(--accent);background:rgba(255,181,71,.28)}
  .spot:not(.ready){cursor:default}
  .room.hot{border-color:var(--accent)}
  .levels{gap:18px}
  @media (max-width:900px){.venue{grid-template-columns:1fr}.map{position:relative;top:0}}
</style>
</head>
<body>
<main class="index">
  <h1>Hijinx · Universal CityWalk</h1>
  <p class="sub">Playable wireframe test rooms · draft room allocation · <span id="count"></span> · click a room on the plan or a card</p>
  <div class="venue">
    <div class="map" id="map"><img id="mapimg" alt="Hijinx floor plan, upper and ground levels, with each game room outlined"></div>
    <div>
      <div class="levels" id="levels"></div>
      <p class="note" style="margin-top:22px">Room sizes from plan SK21 (24 Nov 2026). <span class="tag p">Physical</span><span class="tag t">Thinking</span> No two physical games share a wall. On the plan, solid outlines are playable and dashed ones are planned.</p>
    </div>
  </div>
</main>
<script type="module">
  import { ROOMS, ALLOCATION, MAP } from './core/venue.js';
  const player = new URLSearchParams(location.search).get('mode') === 'player';
  const href = (a) => a.path + (player ? '?mode=player' : '');
  const ready = ALLOCATION.filter(a => a.path).length;
  document.getElementById('count').textContent = `${ready} of ${ALLOCATION.length} playable`;
  const size = (r) => `${Math.round(Math.max(r.d, r.w) * 1000)} × ${Math.round(Math.min(r.d, r.w) * 1000)} mm`;
  const label = (a) => a.room === 'ELEV' ? 'Mock lift' : a.room;

  // ---- floor plan with clickable rooms ----
  const map = document.getElementById('map');
  document.getElementById('mapimg').src = MAP.image;
  const spots = {};
  for (const a of ALLOCATION) {
    const box = MAP.rooms[a.room]; if (!box) continue;
    const [x0, y0, x1, y1] = box;
    const el = document.createElement(a.path ? 'a' : 'div');
    el.className = 'spot' + (a.path ? ' ready' : '') + (a.type === 'P' ? ' p' : '');
    if (a.path) el.href = href(a);
    el.title = `${label(a)} · ${a.game}${a.path ? '' : ' (planned)'}`;
    Object.assign(el.style, { left: `${x0 / MAP.w * 100}%`, top: `${y0 / MAP.h * 100}%`, width: `${(x1 - x0) / MAP.w * 100}%`, height: `${(y1 - y0) / MAP.h * 100}%` });
    el.innerHTML = `<b>${a.game}</b><small>${label(a)}${a.path ? ' · play' : ''}</small>`;
    map.appendChild(el); spots[a.room] = el;
  }

  // ---- room cards ----
  const levels = document.getElementById('levels');
  const cards = {};
  for (const lvl of ['Upper', 'Ground']) {
    const sec = document.createElement('section'); sec.className = 'level';
    sec.innerHTML = `<h2>${lvl} level</h2><div class="rooms"></div>`;
    for (const a of ALLOCATION.filter(a => ROOMS[a.room].level === lvl)) {
      const r = ROOMS[a.room];
      const el = document.createElement(a.path ? 'a' : 'div');
      el.className = 'room' + (a.path ? ' ready' : '');
      if (a.path) el.href = href(a);
      el.innerHTML = `<span class="meta">${label(a)} · ${size(r)}${r.note ? ' · ' + r.note : ''}</span>
        <b>${a.game}</b>
        <span>${a.type === 'P' ? '<span class="tag p">Physical</span>' : a.type === 'T' ? '<span class="tag t">Thinking</span>' : ''}</span>
        <span class="st">${a.path ? 'Playable →' : 'Planned'}</span>`;
      sec.querySelector('.rooms').appendChild(el); cards[a.room] = el;
    }
    levels.appendChild(sec);
  }

  // hovering a card highlights its room on the plan, and the other way round
  for (const id of Object.keys(cards)) {
    const on = (v) => { cards[id].classList.toggle('hot', v); spots[id] && spots[id].classList.toggle('hot', v); };
    for (const el of [cards[id], spots[id]]) if (el) { el.addEventListener('mouseenter', () => on(true)); el.addEventListener('mouseleave', () => on(false)); }
  }
</script>
</body>
</html>
